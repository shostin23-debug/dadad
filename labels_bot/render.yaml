services:
  - type: web
    name: labels-telegram-bot
    runtime: docker
    rootDir: labels_bot
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        value: "7530261961"
      - key: STORE_NAME
        value: Procesador de Etiquetas
      - key: BINANCE_PAY_ID
        value: "796271520"
      - key: LABEL_PRICE
        value: "25"
      - key: MAX_LABELS
        value: "50"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
